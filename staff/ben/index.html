const app=document.getElementById('app'),form=document.getElementById('loginForm'),user=document.getElementById('username'),pass=document.getElementById('password'),button=document.getElementById('loginButton'),error=document.getElementById('loginError'),caps=document.getElementById('capsWarning'),toggle=document.getElementById('togglePassword');
const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const b64=arr=>btoa(String.fromCharCode(...new Uint8Array(arr)));
const digest=async text=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)));
const same=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0};
async function decrypt(username,password){
 const normalized=username.trim().toLowerCase();
 const hash=await digest(normalized);
 if(!same(hash,CONFIG.usernameHash))throw new Error('invalid');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(normalized+'\0'+password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(CONFIG.salt),iterations:CONFIG.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(CONFIG.iv),tagLength:128},key,bytes(CONFIG.payload));
 return JSON.parse(new TextDecoder().decode(plain));
}
function unlock(data){
 document.title=data.title;app.innerHTML=data.markup;
 const urls=data.documents.map(doc=>URL.createObjectURL(new Blob([bytes(doc.base64)],{type:'application/pdf'})));
 app.querySelectorAll('[data-doc]').forEach(control=>control.addEventListener('click',()=>{const i=Number(control.dataset.doc),doc=data.documents[i],url=urls[i];if(control.dataset.action==='open')window.open(url,'_blank','noopener');else{const a=document.createElement('a');a.href=url;a.download=doc.file;document.body.appendChild(a);a.click();a.remove()}}));
 document.getElementById('lockPortal').addEventListener('click',()=>{urls.forEach(URL.revokeObjectURL);location.reload()});
 window.addEventListener('beforeunload',()=>urls.forEach(URL.revokeObjectURL),{once:true});
}
toggle.addEventListener('click',()=>{const showing=pass.type==='text';pass.type=showing?'password':'text';toggle.textContent=showing?'Show':'Hide';toggle.setAttribute('aria-label',showing?'Show password':'Hide password')});
pass.addEventListener('keyup',e=>{caps.textContent=e.getModifierState&&e.getModifierState('CapsLock')?'Caps Lock is on':''});
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Decrypting…';try{unlock(await decrypt(user.value,pass.value))}catch(_){error.textContent='Those credentials did not unlock this page.';button.disabled=false;button.textContent='Unlock staff page';pass.focus();pass.select()}});
})();
</script>
