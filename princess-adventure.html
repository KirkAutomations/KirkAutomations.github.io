<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Princess Kitty's Big Adventure!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Comic Sans MS','Chalkboard SE',cursive}

/* ── GAME ── */
#game{width:100vw;height:100vh;position:relative;overflow:hidden;cursor:default}

/* ── START SCREEN ── */
#start{
  position:absolute;inset:0;z-index:300;
  background:linear-gradient(135deg,#ff9de2,#c484f3,#a8c8ff);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#start h1{font-size:clamp(1.8em,7vw,3.5em);color:white;text-shadow:3px 3px 0 rgba(0,0,0,.2);text-align:center;line-height:1.3}
#start-cat{font-size:clamp(5em,18vw,9em);animation:bob 2s ease-in-out infinite}
.tap-btn{
  background:white;color:#8b25b8;border:none;border-radius:30px;
  padding:16px 44px;font-size:clamp(1.4em,5vw,2em);font-family:inherit;font-weight:bold;
  cursor:pointer;box-shadow:0 8px 0 #c484f3,0 12px 24px rgba(0,0,0,.2);
  animation:btnPulse 1s ease-in-out infinite alternate;
}
@keyframes btnPulse{from{transform:scale(1)}to{transform:scale(1.06)}}

/* ── SCENES ── */
.scene{position:absolute;inset:0;display:none}
.scene.active{display:block}

#sc-garden{background:linear-gradient(to bottom,#87CEEB 0%,#b8e4ff 42%,#90d050 44%,#5cb832 100%)}
#sc-forest{background:linear-gradient(to bottom,#1a3510 0%,#2a5018 40%,#3a6820 42%,#28480e 100%)}
#sc-castle{background:linear-gradient(to bottom,#c8a0f0 0%,#e8d0ff 42%,#b060d8 44%,#8840b0 100%)}

/* CSS art: horizon hill */
.hill{
  position:absolute;bottom:44%;left:-5%;width:110%;height:15%;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  pointer-events:none;
}
#sc-garden .hill{background:#6dbf44}
#sc-forest .hill{background:#253d10}
#sc-castle .hill{background:#9050c8}

/* CSS art: clouds */
.cld{position:absolute;background:rgba(255,255,255,.82);border-radius:40px;pointer-events:none}
.cld::before,.cld::after{content:'';position:absolute;background:inherit;border-radius:50%}

/* ground texture strip */
.ground-strip{
  position:absolute;bottom:0;left:0;right:0;height:44%;
  pointer-events:none;opacity:.18;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 40px);
}

/* ── OBJECTS ── */
.obj{
  position:absolute;transform:translate(-50%,-50%);
  cursor:pointer;text-align:center;line-height:1;
  transition:filter .2s;z-index:10;
  display:flex;flex-direction:column;align-items:center;
}
.obj:hover{filter:brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,.8))}
.obj .ic{display:block;font-size:inherit;transition:transform .15s}
.obj:active .ic{transform:scale(.85)}

/* gem glow */
.gem-obj .ic{animation:gemGlow 1.5s ease-in-out infinite alternate}
@keyframes gemGlow{from{filter:drop-shadow(0 0 4px gold)}to{filter:drop-shadow(0 0 16px gold) brightness(1.3)}}

.gem-hint{font-size:.45em;animation:hintSpin 2s linear infinite;display:block;margin-bottom:-4px}
@keyframes hintSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* click animations */
@keyframes boing{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-65%) scale(1.35) rotate(12deg)}65%{transform:translate(-50%,-45%) scale(.9) rotate(-6deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes flyAway{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-250%) scale(0) rotate(720deg);opacity:0}}

.clicked{animation:boing .45s ease-out}
.flying{animation:flyAway .6s ease-in forwards}

/* ambient */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-6deg)}50%{transform:translate(-50%,-50%) rotate(6deg)}}
@keyframes floatY{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-10px)}}
@keyframes drift{0%,100%{transform:translate(-50%,-50%) translateX(0)}50%{transform:translate(-50%,-50%) translateX(18px)}}
@keyframes spinSlow{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}

.a-sway{animation:sway 2.5s ease-in-out infinite}
.a-float{animation:floatY 3s ease-in-out infinite}
.a-drift{animation:drift 5s ease-in-out infinite}
.a-spin{animation:spinSlow 10s linear infinite}
.a-bob{animation:bob 2.8s ease-in-out infinite}

/* ── PRINCESS KITTY ── */
#kitty{
  position:absolute;left:9%;bottom:26%;z-index:20;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;
  animation:bob 2.5s ease-in-out infinite;
  transition:left .6s ease,bottom .4s ease;
}
#kc{font-size:clamp(3.5em,10vmin,6em);animation:crownWig 3s ease-in-out infinite}
@keyframes crownWig{0%,100%{transform:rotate(-6deg) translateY(2px)}50%{transform:rotate(6deg) translateY(0)}}
#kf{font-size:clamp(5em,14vmin,8em);transition:all .3s;line-height:1}

/* ── SPEECH BUBBLE ── */
#bubble{
  position:absolute;bottom:0;left:0;right:0;z-index:60;
  display:flex;align-items:flex-end;padding:10px 14px 12px 14px;
  pointer-events:none;
  opacity:0;transform:translateY(30px);transition:opacity .35s,transform .35s;
}
#bubble.show{opacity:1;transform:translateY(0);pointer-events:all}
#bbtail{
  width:0;height:0;
  border-right:14px solid transparent;
  border-top:14px solid rgba(255,255,255,.97);
  position:absolute;bottom:-13px;left:36px;
}
#bbbox{
  background:rgba(255,255,255,.97);
  border-radius:22px;padding:12px 18px;
  box-shadow:0 6px 28px rgba(0,0,0,.22),0 0 0 3px #c484f3;
  max-width:68%;margin-left:17%;position:relative;
  font-size:clamp(1em,3.5vw,1.5em);color:#5b1a8a;
  font-weight:bold;line-height:1.4;
}
#bbbox::after{content:'';position:absolute;bottom:-13px;left:36px;
  width:0;height:0;border-right:14px solid transparent;border-top:14px solid #c484f3}

/* ── INVENTORY ── */
#inv{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  z-index:60;background:rgba(255,255,255,.88);border-radius:30px;
  padding:7px 18px;display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 18px rgba(0,0,0,.18),0 0 0 2px #c484f3;
  font-size:clamp(.8em,2.5vw,1.1em);color:#7b1fa2;font-weight:bold;white-space:nowrap;
}
.gslot{font-size:1.7em;opacity:.28;transition:opacity .4s,transform .4s}
.gslot.got{opacity:1;animation:gemPop .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes gemPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}

/* ── NAV ARROWS ── */
.nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:50;
  background:rgba(255,255,255,.82);border:none;border-radius:50%;
  width:clamp(42px,9vmin,68px);height:clamp(42px,9vmin,68px);
  font-size:clamp(1.2em,3.5vmin,2em);cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.2);color:#7b1fa2;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,background .2s;
}
.nav:hover{background:white;transform:translateY(-50%) scale(1.1)}
.nav.off{display:none}
#nl{left:8px}#nr{right:8px}

/* ── SCENE LABEL ── */
#slabel{
  position:absolute;top:12px;left:12px;z-index:60;
  font-size:clamp(.85em,2.8vw,1.2em);color:white;
  text-shadow:2px 2px 5px rgba(0,0,0,.5);font-weight:bold;
}

/* ── SOUND BTN ── */
#snd{
  position:absolute;top:10px;right:10px;z-index:70;
  background:rgba(255,255,255,.85);border:none;border-radius:50%;
  width:44px;height:44px;font-size:1.4em;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

/* ── TRANSITION ── */
#trans{
  position:fixed;inset:0;z-index:200;background:#111;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
#trans.dark{opacity:1;pointer-events:all}

/* ── VFX ── */
#vfx{position:fixed;inset:0;pointer-events:none;z-index:150}
.spark{
  position:absolute;pointer-events:none;
  animation:sparkFly var(--d) ease-out forwards;
}
@keyframes sparkFly{0%{transform:translate(0,0) scale(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.2);opacity:0}}
.conf{
  position:absolute;pointer-events:none;border-radius:3px;
  animation:confFall var(--d) linear forwards;
}
@keyframes confFall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ── WIN SCREEN ── */
#win{
  position:fixed;inset:0;z-index:250;
  background:linear-gradient(135deg,#c484f3,#ff9de2,#ffe44d,#ff9de2,#c484f3);
  background-size:400% 400%;animation:gradMove 3s ease infinite;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;
}
#win.show{display:flex}
@keyframes gradMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.wt{font-size:clamp(2em,7vw,3.5em);color:white;text-shadow:3px 3px 0 rgba(0,0,0,.2);text-align:center;animation:wPulse .8s ease-in-out infinite alternate}
@keyframes wPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.wcat{font-size:clamp(4em,13vw,7em);animation:wDance .4s ease-in-out infinite alternate}
@keyframes wDance{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
</style>
</head>
<body>
<div id="game">
  <div id="trans"></div>
  <div id="vfx"></div>

  <!-- START SCREEN -->
  <div id="start">
    <div id="start-cat">🐱</div>
    <h1>👑 Princess Kitty's<br>Big Adventure! 🌟</h1>
    <button class="tap-btn" onclick="startGame()">✨ Tap to Play! ✨</button>
  </div>

  <!-- SCENE: ROYAL GARDEN -->
  <div class="scene" id="sc-garden">
    <div class="hill"></div>
    <div class="ground-strip"></div>
    <div class="cld" style="width:12%;height:3.5%;top:9%;left:18%;animation:drift 20s ease-in-out infinite"></div>
    <div class="cld" style="width:9%;height:3%;top:14%;left:55%;animation:drift 28s ease-in-out infinite 4s"></div>
    <div class="cld" style="width:7%;height:2.5%;top:8%;left:72%;animation:drift 22s ease-in-out infinite 2s"></div>
    <div style="position:absolute;top:5%;left:30%;font-size:9vmin;opacity:.35;pointer-events:none;animation:floatY 6s ease-in-out infinite">🌈</div>
  </div>

  <!-- SCENE: ENCHANTED FOREST -->
  <div class="scene" id="sc-forest">
    <div class="hill"></div>
    <div class="ground-strip"></div>
    <div style="position:absolute;top:5%;right:8%;font-size:9vmin;pointer-events:none;animation:floatY 6s ease-in-out infinite">🌙</div>
    <div style="position:absolute;top:8%;left:15%;font-size:4vmin;pointer-events:none;opacity:.7;animation:bob 3s infinite">⭐</div>
    <div style="position:absolute;top:12%;left:45%;font-size:3vmin;pointer-events:none;opacity:.6;animation:bob 4s infinite 1s">⭐</div>
    <div style="position:absolute;top:6%;left:70%;font-size:3.5vmin;pointer-events:none;opacity:.7;animation:bob 2.5s infinite .5s">✨</div>
  </div>

  <!-- SCENE: CANDY CASTLE -->
  <div class="scene" id="sc-castle">
    <div class="hill"></div>
    <div class="ground-strip"></div>
    <div style="position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:28vmin;opacity:.25;pointer-events:none">🏰</div>
    <div style="position:absolute;top:4%;left:18%;font-size:5vmin;pointer-events:none;animation:sway 3s infinite">🚩</div>
    <div style="position:absolute;top:4%;right:18%;font-size:5vmin;pointer-events:none;animation:sway 3s infinite 1s">🚩</div>
    <div style="position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:7vmin;pointer-events:none;animation:floatY 5s infinite">🌟</div>
  </div>

  <!-- Princess Kitty -->
  <div id="kitty" onclick="kittyTap()">
    <div id="kc">👑</div>
    <div id="kf">🐱</div>
  </div>

  <div id="slabel">🌸 Royal Garden</div>

  <div id="inv">
    👑 Gems:
    <span class="gslot" id="g0">💎</span>
    <span class="gslot" id="g1">💎</span>
    <span class="gslot" id="g2">💎</span>
  </div>

  <button class="nav off" id="nl" onclick="go(-1)">◄</button>
  <button class="nav" id="nr" onclick="go(1)">►</button>

  <button id="snd" onclick="toggleSnd()">🔊</button>

  <div id="bubble">
    <div id="bbbox">
      <span id="bbtxt"></span>
      <div id="bbtail"></div>
    </div>
  </div>
</div>

<div id="win">
  <div style="font-size:clamp(3em,11vw,6em)">👑✨👑</div>
  <div class="wcat">😻</div>
  <div class="wt">Princess Kitty's Crown<br>is RESTORED! 🌟</div>
  <div style="font-size:clamp(1em,3.5vw,1.6em);color:white;text-align:center">You are the BEST helper in the whole kingdom!</div>
  <button class="tap-btn" onclick="restart()">Play Again! 🎉</button>
</div>

<script>
'use strict';

const SCENES=['garden','forest','castle'];
const LABELS={garden:'🌸 Royal Garden',forest:'🌲 Magic Forest',castle:'🏰 Candy Castle'};
const INTROS={
  garden:"Welcome to Princess Kitty's Royal Garden! Tap everything you see!",
  forest:"Ooooh, the Magic Forest! It's full of surprises! Tap everything!",
  castle:"Wow! The Candy Castle! Everything sparkles here! Tap and explore!",
};

const OBJS={
  garden:[
    {id:'sun',x:83,y:11,sz:9,e:'☀️',a:'a-spin',f:'😄',say:"The golden sun is warm and happy today! It shines all day long for Princess Kitty!"},
    {id:'cld',x:32,y:17,sz:10,e:'☁️',a:'a-drift',f:'😊',say:"That fluffy cloud looks just like a bunny rabbit! Do you see the bunny?"},
    {id:'bird',x:22,y:32,sz:7,e:'🐦',a:'a-bob',f:'😄',say:"Tweet tweet! The little blue bird is singing a happy song! La la la!"},
    {id:'tree1',x:11,y:42,sz:15,e:'🌳',a:'a-sway',f:'😊',say:"This enormous oak tree has lived in the garden for one hundred years! A squirrel lives inside!"},
    {id:'tree2',x:89,y:42,sz:15,e:'🌳',a:'a-sway',f:'😊',say:"A friendly family of birds has built a cozy nest high up in this tree!"},
    {id:'butt',x:65,y:38,sz:8,e:'🦋',a:'a-float',f:'😍',say:"Oh how beautiful! The butterfly loves dancing around the pretty flowers! Flutter flutter!"},
    {id:'flower',x:40,y:72,sz:9,e:'🌸',a:'a-sway',f:'😊',say:"Pretty pink flowers! They smell like strawberries and fairy dust and dreams!"},
    {id:'tulip',x:28,y:76,sz:7,e:'🌷',a:'a-sway',f:'😊',say:"A bright red tulip! Flowers make Princess Kitty very happy!"},
    {id:'fount',x:62,y:63,sz:13,e:'⛲',a:'a-bob',f:'😻',gem:0,say:"Splash! Something magical is sparkling in the fountain! It's the RUBY gem! 💎"},
  ],
  forest:[
    {id:'bigtree',x:78,y:38,sz:17,e:'🌲',a:'a-sway',f:'😮',say:"Wow! This tree is SO tall it tickles the clouds! The oldest tree in the whole magic forest!"},
    {id:'owl',x:72,y:28,sz:9,e:'🦉',a:'a-bob',f:'😮',say:"Hoo hoo! I am the Wise Old Owl. I know every single secret hiding in this forest!"},
    {id:'tree2',x:18,y:35,sz:14,e:'🌲',a:'a-sway',f:'😊',say:"The magic forest trees glow a little bit at night! Like they have tiny lights inside!"},
    {id:'fox',x:22,y:65,sz:10,e:'🦊',a:'a-bob',f:'😄',say:"Hello Princess Kitty! I'm a friendly fox! I'm looking for the sweetest berries in the forest!"},
    {id:'mush',x:42,y:70,sz:9,e:'🍄',a:'a-bob',f:'😮',say:"Magic mushrooms! They glow in the dark and tiny fairies dance on them at midnight!"},
    {id:'frog',x:63,y:74,sz:8,e:'🐸',a:'a-float',f:'😄',say:"Ribbit ribbit! The happy green frog leaps from lily pad to lily pad! Boing boing boing!"},
    {id:'fire',x:50,y:35,sz:8,e:'🌟',a:'a-float',f:'😍',say:"A magical firefly! It glows like a tiny star that decided to come down and play!"},
    {id:'deer',x:35,y:58,sz:10,e:'🦌',a:'a-bob',f:'😊',say:"A gentle deer! She has the softest brown eyes and loves to eat the forest flowers!"},
    {id:'rock',x:55,y:62,sz:12,e:'🪨',a:'a-bob',f:'😻',gem:1,say:"There's something glowing under this big magic rock! It's the SAPPHIRE gem! 💎"},
  ],
  castle:[
    {id:'rainbow',x:50,y:22,sz:13,e:'🌈',a:'a-float',f:'😍',say:"A magical rainbow over the castle! Count the colors: red, orange, yellow, green, blue, purple!"},
    {id:'guard',x:30,y:63,sz:11,e:'🐱',a:'a-bob',f:'😄',say:"Meow! I'm Captain Whiskers, the Royal Guard Cat! Welcome to the Candy Castle, Princess!"},
    {id:'swan',x:78,y:68,sz:10,e:'🦢',a:'a-drift',f:'😊',say:"The graceful royal swans glide across the sparkling moat! So elegant and beautiful!"},
    {id:'cake',x:20,y:67,sz:10,e:'🎂',a:'a-bob',f:'😄',say:"The royal birthday cake has FIVE layers! Strawberry, chocolate, vanilla, lemon, and magic!"},
    {id:'wand',x:72,y:42,sz:9,e:'🪄',a:'a-float',f:'😊',say:"The fairy godmother's magic wand! One wave and glitter rains down from the sky!"},
    {id:'rose',x:20,y:45,sz:10,e:'🌹',a:'a-sway',f:'😊',say:"The royal roses are as red as rubies! They smell like the sweetest perfume ever made!"},
    {id:'candy',x:72,y:68,sz:9,e:'🍭',a:'a-bob',f:'😄',say:"A giant candy cane! Everything in the Candy Castle tastes like something yummy!"},
    {id:'door',x:50,y:55,sz:13,e:'🚪',a:'a-bob',f:'😮',say:"The grand royal door! It's made of solid gold with ten thousand tiny diamonds on it!"},
    {id:'throne',x:50,y:65,sz:14,e:'🪑',a:'a-bob',f:'😻',gem:2,say:"The Royal Throne sparkles with magic! The EMERALD gem is right here! 💎"},
  ],
};

const GEM_E=['❤️','💙','💚'];
const GEM_N=['Ruby','Sapphire','Emerald'];
const CONF=['#ff9de2','#c484f3','#ffe44d','#ff6b9d','#a8c8ff','#fff','#ffd700'];
const SPARKS=['✨','⭐','💫','🌟','💖'];

let scene=0,gems=[false,false,false],soundOn=true,bTimer=null,mTimer=null,actx=null;

function ctx(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  return actx;
}
function tone(f,d,type='triangle',vol=.18,delay=0){
  if(!soundOn)return;
  try{
    const c=ctx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=f;
    const t=c.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
function sndClick(){tone(880,.08,'sine',.18);tone(1100,.08,'sine',.14,.07)}
function sndGem(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'sine',.25,i*.09))}
function sndWin(){
  [[523,0],[659,.15],[784,.3],[1047,.45],[784,.65],[1047,.8],[1319,.95],[1047,1.2],[1319,1.45],[1568,1.7]]
  .forEach(([f,t])=>tone(f,.5,'triangle',.28,t));
}
function sndNav(){[392,523].forEach((f,i)=>tone(f,.12,'square',.1,i*.07))}

const MELODIES={
  garden:[[392,.25],[440,.2],[494,.2],[523,.35],[494,.2],[440,.2],[392,.4],[349,.2],[392,.2],[440,.2],[392,.55]],
  forest:[[294,.3],[330,.25],[370,.3],[330,.2],[294,.4],[262,.2],[294,.25],[330,.2],[370,.5]],
  castle:[[523,.2],[587,.2],[659,.2],[698,.3],[659,.2],[587,.2],[523,.5],[587,.2],[659,.2],[784,.55]],
};
function playMusic(){
  clearTimeout(mTimer);
  if(!soundOn)return;
  const notes=MELODIES[SCENES[scene]];
  let d=0;
  notes.forEach(([f,dur])=>{tone(f,dur*.8,'triangle',.08,d);d+=dur;});
  mTimer=setTimeout(playMusic,(d+.6)*1000);
}

function say(txt){
  if(!soundOn||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt.replace(/[✨💎❤️💙💚🌟⭐👑🌈]/g,''));
  u.rate=.82;u.pitch=1.25;u.volume=1;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/Samantha|Karen|Moira|Fiona/.test(v.name))||vs.find(v=>v.lang.startsWith('en')&&v.localService)||null;
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function toggleSnd(){
  soundOn=!soundOn;
  document.getElementById('snd').textContent=soundOn?'🔊':'🔇';
  if(!soundOn){speechSynthesis?.cancel();clearTimeout(mTimer);}
  else{ctx().resume();playMusic();}
}

function bubble(txt){
  clearTimeout(bTimer);
  document.getElementById('bbtxt').textContent=txt;
  document.getElementById('bubble').classList.add('show');
  say(txt);
  bTimer=setTimeout(()=>{
    document.getElementById('bubble').classList.remove('show');
    document.getElementById('kf').textContent='🐱';
  },5500);
}

function renderScene(name){
  const el=document.getElementById('sc-'+name);
  el.querySelectorAll('.obj').forEach(e=>e.remove());
  OBJS[name].forEach(o=>{
    if(o.gem!==undefined&&gems[o.gem])return;
    const div=document.createElement('div');
    div.className='obj '+(o.a||'')+(o.gem!==undefined?' gem-obj':'');
    div.style.cssText=`left:${o.x}%;top:${o.y}%;font-size:${o.sz}vmin`;
    div.id='o-'+o.id;
    if(o.gem!==undefined){
      const hint=document.createElement('span');
      hint.className='gem-hint';hint.textContent='✨';
      div.appendChild(hint);
    }
    const ic=document.createElement('span');
    ic.className='ic';ic.textContent=o.e;
    div.appendChild(ic);
    div.onclick=()=>objClick(o,div);
    el.appendChild(div);
  });
}

function objClick(o,el){
  sndClick();
  el.classList.remove('clicked');
  void el.offsetWidth;
  el.classList.add('clicked');
  el.addEventListener('animationend',()=>el.classList.remove('clicked'),{once:true});
  document.getElementById('kf').textContent=o.f||'😊';
  bubble(o.say);
  const r=el.getBoundingClientRect();
  sparks(r.left+r.width/2,r.top+r.height/2,8);
  if(o.gem!==undefined&&!gems[o.gem]){
    setTimeout(()=>collectGem(o,el),650);
  }
}

function collectGem(o,el){
  gems[o.gem]=true;
  sndGem();
  el.classList.add('flying');
  setTimeout(()=>{
    el.remove();
    const slot=document.getElementById('g'+o.gem);
    slot.textContent=GEM_E[o.gem];
    slot.classList.add('got');
    sparks(slot.getBoundingClientRect().left+20,slot.getBoundingClientRect().top+20,14);
    confetti(35);
    say(`You found the ${GEM_N[o.gem]} gem! You're amazing! ${gems.filter(Boolean).length} of 3!`);
    if(gems.every(Boolean))setTimeout(winGame,1800);
  },550);
}

function kittyTap(){
  const lines=[
    "Meow! Help me find my three missing crown jewels! They're hidden somewhere in the kingdom!",
    "You're doing so great! Keep tapping everything you see!",
    `I have ${gems.filter(Boolean).length} gem${gems.filter(Boolean).length!==1?'s':''} so far! Let's find them all!`,
    "Purrrr! You are the best helper in the whole entire kingdom! I love you!",
    "Meow meow! Tap everything! The gems are hiding somewhere close by!",
    "You make Princess Kitty SO happy! Keep exploring!",
  ];
  sndClick();
  bubble(lines[Math.floor(Math.random()*lines.length)]);
  document.getElementById('kf').textContent='😻';
  sparks(
    document.getElementById('kitty').getBoundingClientRect().left+40,
    document.getElementById('kitty').getBoundingClientRect().top+40,6
  );
}

function go(dir){
  const next=scene+dir;
  if(next<0||next>=SCENES.length)return;
  sndNav();
  const tr=document.getElementById('trans');
  tr.classList.add('dark');
  setTimeout(()=>{
    document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
    scene=next;
    const name=SCENES[scene];
    document.getElementById('sc-'+name).classList.add('active');
    document.getElementById('slabel').textContent=LABELS[name];
    document.getElementById('nl').classList.toggle('off',scene===0);
    document.getElementById('nr').classList.toggle('off',scene===SCENES.length-1);
    renderScene(name);
    playMusic();
    tr.classList.remove('dark');
    setTimeout(()=>bubble(INTROS[name]),400);
  },380);
}

function winGame(){
  sndWin();
  confetti(130);
  document.getElementById('win').classList.add('show');
  setTimeout(()=>say("You found all three crown jewels! Princess Kitty's crown is completely restored! You are the most wonderful helper in the whole wide kingdom! Hooray!"),600);
}

function restart(){
  gems=[false,false,false];
  scene=0;
  ['g0','g1','g2'].forEach(id=>{
    const e=document.getElementById(id);
    e.classList.remove('got');e.textContent='💎';
  });
  document.getElementById('win').classList.remove('show');
  document.getElementById('kf').textContent='🐱';
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc-garden').classList.add('active');
  document.getElementById('slabel').textContent=LABELS.garden;
  document.getElementById('nl').classList.add('off');
  document.getElementById('nr').classList.remove('off');
  renderScene('garden');
  playMusic();
  setTimeout(()=>bubble("Let's go again! Find all 3 crown jewels! Tap everything!"),500);
}

function sparks(cx,cy,n){
  const v=document.getElementById('vfx');
  for(let i=0;i<n;i++){
    const e=document.createElement('div');
    e.className='spark';
    e.textContent=SPARKS[Math.floor(Math.random()*SPARKS.length)];
    const a=(Math.PI*2*i/n)+(Math.random()-.5);
    const d=55+Math.random()*70;
    e.style.cssText=`left:${cx}px;top:${cy}px;font-size:clamp(1em,3vw,1.6em);--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--d:${.6+Math.random()*.5}s;animation-delay:${Math.random()*.15}s`;
    v.appendChild(e);setTimeout(()=>e.remove(),1600);
  }
}
function confetti(n){
  const v=document.getElementById('vfx');
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const e=document.createElement('div');
      e.className='conf';
      const sz=8+Math.random()*10;
      e.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;background:${CONF[Math.floor(Math.random()*CONF.length)]};--d:${1.9+Math.random()*2.2}s;animation-delay:${Math.random()*.3}s`;
      v.appendChild(e);setTimeout(()=>e.remove(),5000);
    },i*18);
  }
}

if(window.speechSynthesis&&speechSynthesis.getVoices().length===0){
  speechSynthesis.addEventListener('voiceschanged',()=>{},{once:true});
}

function startGame(){
  document.getElementById('start').style.display='none';
  document.getElementById('sc-garden').classList.add('active');
  renderScene('garden');
  ctx().resume();
  playMusic();
  setTimeout(()=>bubble("Hello! I'm Princess Kitty! My crown jewels are lost! Tap EVERYTHING to find the 3 hidden gems! Let's go! Meow!"),600);
}
</script>
</body>
</html>
