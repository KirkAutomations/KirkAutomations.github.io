<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Princess Kitty's Big Adventure!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Comic Sans MS','Chalkboard SE',cursive}

#game{width:100vw;height:100vh;position:relative;overflow:hidden}

/* ── START ── */
#start{
  position:absolute;inset:0;z-index:300;
  background:linear-gradient(135deg,#ff9de2,#c484f3,#a8c8ff);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#start h1{font-size:clamp(1.8em,7vw,3.2em);color:white;text-shadow:3px 3px 0 rgba(0,0,0,.2);text-align:center;line-height:1.3}
#start-cat{font-size:clamp(5em,18vw,8em);animation:bob 2s ease-in-out infinite}
.tap-btn{
  background:white;color:#8b25b8;border:none;border-radius:30px;
  padding:15px 42px;font-size:clamp(1.3em,5vw,1.9em);font-family:inherit;font-weight:bold;
  cursor:pointer;box-shadow:0 8px 0 #c484f3,0 12px 24px rgba(0,0,0,.2);
  animation:btnPulse 1s ease-in-out infinite alternate;
}
@keyframes btnPulse{from{transform:scale(1)}to{transform:scale(1.07)}}

/* ── SCENES ── */
.scene{position:absolute;inset:0;display:none}
.scene.active{display:block}
#sc-garden{background:linear-gradient(to bottom,#87CEEB 0%,#b8e4ff 42%,#90d050 44%,#5cb832 100%)}
#sc-forest{background:linear-gradient(to bottom,#1a3510 0%,#2a5018 40%,#3a6820 42%,#28480e 100%)}
#sc-castle{background:linear-gradient(to bottom,#c8a0f0 0%,#e8d0ff 42%,#b060d8 44%,#8840b0 100%)}
.hill{position:absolute;bottom:44%;left:-5%;width:110%;height:15%;border-radius:50% 50% 0 0/100% 100% 0 0;pointer-events:none}
#sc-garden .hill{background:#6dbf44}
#sc-forest .hill{background:#253d10}
#sc-castle .hill{background:#9050c8}
.cld{position:absolute;background:rgba(255,255,255,.82);border-radius:40px;pointer-events:none}

/* ── OBJECTS ── */
.obj{
  position:absolute;transform:translate(-50%,-50%);
  cursor:pointer;text-align:center;line-height:1;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(2px 4px 6px rgba(0,0,0,.15));
  transition:filter .2s;
}
.obj:hover{filter:brightness(1.15) drop-shadow(0 0 10px rgba(255,255,255,.9))}
.obj .ic{display:block;font-size:inherit;transition:transform .12s}
.obj:active .ic{transform:scale(.82)}
.gem-obj .ic{animation:gemGlow 1.4s ease-in-out infinite alternate}
@keyframes gemGlow{from{filter:drop-shadow(0 0 4px gold)}to{filter:drop-shadow(0 0 18px gold) brightness(1.35)}}
.gem-hint{font-size:.4em;animation:hintSpin 2s linear infinite;display:block;margin-bottom:-2px}
@keyframes hintSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* click */
@keyframes boing{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-65%) scale(1.38) rotate(12deg)}65%{transform:translate(-50%,-45%) scale(.88) rotate(-6deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes flyUp{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-260%) scale(0) rotate(720deg);opacity:0}}
.boing{animation:boing .45s ease-out}
.flyup{animation:flyUp .6s ease-in forwards}

/* ambient */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-6deg)}50%{transform:translate(-50%,-50%) rotate(6deg)}}
@keyframes floatY{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-10px)}}
@keyframes drift{0%,100%{transform:translate(-50%,-50%) translateX(0)}50%{transform:translate(-50%,-50%) translateX(18px)}}
@keyframes spinSlow{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.a-sway{animation:sway 2.5s ease-in-out infinite}
.a-float{animation:floatY 3s ease-in-out infinite}
.a-drift{animation:drift 5s ease-in-out infinite}
.a-spin{animation:spinSlow 10s linear infinite}
.a-bob{animation:bob 2.8s ease-in-out infinite}

/* ── KITTY ── */
#kitty{
  position:absolute;left:9%;bottom:25%;z-index:20;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;animation:bob 2.5s ease-in-out infinite;
}
#kc{font-size:clamp(3em,8vmin,5.5em);animation:crownWig 3s ease-in-out infinite}
@keyframes crownWig{0%,100%{transform:rotate(-6deg) translateY(2px)}50%{transform:rotate(6deg) translateY(0)}}
#kf{font-size:clamp(4.5em,13vmin,7.5em);transition:all .3s;line-height:1}

/* ── INVENTORY ── */
#inv{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(255,255,255,.88);border-radius:30px;padding:7px 18px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 18px rgba(0,0,0,.18),0 0 0 2px #c484f3;
  font-size:clamp(.8em,2.5vw,1.1em);color:#7b1fa2;font-weight:bold;white-space:nowrap;
}
.gs{font-size:1.7em;opacity:.25;transition:opacity .4s,transform .4s}
.gs.got{opacity:1;animation:gemPop .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes gemPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}

/* ── NAV ── */
.nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:50;
  background:rgba(255,255,255,.82);border:none;border-radius:50%;
  width:clamp(42px,9vmin,66px);height:clamp(42px,9vmin,66px);
  font-size:clamp(1.2em,3.5vmin,2em);cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.2);color:#7b1fa2;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,background .2s;
}
.nav:hover{background:white;transform:translateY(-50%) scale(1.1)}
.nav.off{display:none}
#nl{left:8px}#nr{right:8px}

/* ── SCENE LABEL ── */
#slabel{
  position:absolute;top:12px;left:12px;z-index:60;
  font-size:clamp(.85em,2.8vw,1.2em);color:white;
  text-shadow:2px 2px 5px rgba(0,0,0,.5);font-weight:bold;
}

/* ── SOUND ── */
#snd{
  position:absolute;top:10px;right:10px;z-index:70;
  background:rgba(255,255,255,.85);border:none;border-radius:50%;
  width:44px;height:44px;font-size:1.4em;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

/* ── WORD CARD OVERLAY ── */
#overlay{
  position:fixed;inset:0;z-index:90;
  background:rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .35s;
}
#overlay.show{opacity:1;pointer-events:all}

/* ── WORD CARD ── */
#wcard{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.98);
  border-radius:28px 28px 0 0;
  padding:18px 16px 30px;
  box-shadow:0 -8px 40px rgba(160,80,220,.38),0 0 0 3px #c484f3;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  transform:translateY(105%);
  transition:transform .42s cubic-bezier(.175,.885,.32,1);
}
#wcard.show{transform:translateY(0)}

#wc-emoji{font-size:clamp(3.5em,13vmin,5.5em);line-height:1.1}
#wc-prompt{
  font-size:clamp(.95em,3.4vw,1.3em);color:#7b1fa2;font-weight:bold;
  text-align:center;min-height:1.6em;
}
#wc-row{display:flex;gap:clamp(6px,2vw,12px);flex-wrap:wrap;justify-content:center}

/* letter buttons — same feel as reading game */
.wc-btn{
  width:clamp(52px,14vw,72px);height:clamp(52px,14vw,72px);
  border-radius:16px;border:none;
  background:linear-gradient(145deg,#ff9de2,#c484f3);
  color:white;font-size:clamp(1.7em,5.2vw,2.3em);
  font-weight:bold;font-family:inherit;cursor:pointer;text-transform:uppercase;
  box-shadow:0 5px 0 #8b25b8,0 8px 16px rgba(0,0,0,.18);
  transition:transform .1s,box-shadow .1s;
  display:flex;align-items:center;justify-content:center;
}
.wc-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8b25b8}
.wc-btn.lit{
  background:linear-gradient(145deg,#ffe44d,#ffb347);
  box-shadow:0 5px 0 #b86800,0 0 22px rgba(255,210,0,.55);
  animation:ll .32s ease-out;
}
@keyframes ll{0%{transform:scale(1)}40%{transform:scale(1.42)}100%{transform:scale(1)}}

#wc-skip{
  font-size:clamp(.8em,2.8vw,1em);color:rgba(139,37,184,.45);
  background:none;border:none;cursor:pointer;font-family:inherit;
  opacity:0;transition:opacity .3s;padding:4px 12px;
}

/* ── TRANSITION ── */
#trans{
  position:fixed;inset:0;z-index:200;background:#111;
  opacity:0;pointer-events:none;transition:opacity .38s;
}
#trans.dark{opacity:1;pointer-events:all}

/* ── VFX ── */
#vfx{position:fixed;inset:0;pointer-events:none;z-index:400}
.spark{position:absolute;animation:sparkFly var(--d) ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.2);opacity:0}}
.conf{position:absolute;border-radius:3px;animation:confFall var(--d) linear forwards}
@keyframes confFall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ── WIN ── */
#win{
  position:fixed;inset:0;z-index:250;
  background:linear-gradient(135deg,#c484f3,#ff9de2,#ffe44d,#ff9de2,#c484f3);
  background-size:400% 400%;animation:gm 3s ease infinite;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;
}
#win.show{display:flex}
@keyframes gm{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.wt{font-size:clamp(2em,7vw,3.2em);color:white;text-shadow:3px 3px 0 rgba(0,0,0,.2);text-align:center;animation:wp .8s ease-in-out infinite alternate}
@keyframes wp{from{transform:scale(1)}to{transform:scale(1.07)}}
.wcat{font-size:clamp(4em,13vw,7em);animation:wd .4s ease-in-out infinite alternate}
@keyframes wd{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
</style>
</head>
<body>
<div id="game">
  <div id="trans"></div>
  <div id="vfx"></div>

  <!-- START -->
  <div id="start">
    <div id="start-cat">🐱</div>
    <h1>👑 Princess Kitty's<br>Big Adventure! 🌟</h1>
    <button class="tap-btn" onclick="startGame()">✨ Tap to Play! ✨</button>
  </div>

  <!-- GARDEN -->
  <div class="scene" id="sc-garden">
    <div class="hill"></div>
    <div class="cld" style="width:12%;height:3.5%;top:9%;left:18%;animation:drift 20s ease-in-out infinite"></div>
    <div class="cld" style="width:9%;height:3%;top:14%;left:55%;animation:drift 28s ease-in-out infinite 4s"></div>
    <div class="cld" style="width:7%;height:2.5%;top:8%;left:72%;animation:drift 22s ease-in-out infinite 2s"></div>
    <div style="position:absolute;top:5%;left:28%;font-size:8vmin;opacity:.3;pointer-events:none;animation:floatY 6s ease-in-out infinite">🌈</div>
  </div>

  <!-- FOREST -->
  <div class="scene" id="sc-forest">
    <div class="hill"></div>
    <div style="position:absolute;top:5%;right:8%;font-size:9vmin;pointer-events:none;animation:floatY 6s ease-in-out infinite">🌙</div>
    <div style="position:absolute;top:8%;left:15%;font-size:4vmin;pointer-events:none;opacity:.7;animation:bob 3s infinite">⭐</div>
    <div style="position:absolute;top:6%;left:70%;font-size:3.5vmin;pointer-events:none;opacity:.7;animation:bob 2.5s infinite .5s">✨</div>
  </div>

  <!-- CASTLE -->
  <div class="scene" id="sc-castle">
    <div class="hill"></div>
    <div style="position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:26vmin;opacity:.22;pointer-events:none">🏰</div>
    <div style="position:absolute;top:4%;left:18%;font-size:5vmin;pointer-events:none;animation:sway 3s infinite">🚩</div>
    <div style="position:absolute;top:4%;right:18%;font-size:5vmin;pointer-events:none;animation:sway 3s infinite 1s">🚩</div>
  </div>

  <!-- Kitty -->
  <div id="kitty" onclick="kittyTap()">
    <div id="kc">👑</div>
    <div id="kf">🐱</div>
  </div>

  <div id="slabel">🌸 Royal Garden</div>
  <div id="inv">
    👑 Gems:
    <span class="gs" id="g0">💎</span>
    <span class="gs" id="g1">💎</span>
    <span class="gs" id="g2">💎</span>
  </div>

  <button class="nav off" id="nl" onclick="go(-1)">◀</button>
  <button class="nav" id="nr" onclick="go(1)">▶</button>
  <button id="snd" onclick="toggleSnd()">🔊</button>

  <!-- Word card overlay -->
  <div id="overlay"></div>

  <!-- Word card -->
  <div id="wcard">
    <div id="wc-emoji">🌳</div>
    <div id="wc-prompt">Tap each letter!</div>
    <div id="wc-row"></div>
    <button id="wc-skip" onclick="hideCard()">keep exploring →</button>
  </div>
</div>

<!-- WIN -->
<div id="win">
  <div style="font-size:clamp(3em,11vw,6em)">👑✨👑</div>
  <div class="wcat">😻</div>
  <div class="wt">Princess Kitty's Crown<br>is RESTORED! 🌟</div>
  <div style="font-size:clamp(1em,3.5vw,1.5em);color:white;text-align:center;margin-top:4px">You're an amazing reader!</div>
  <button class="tap-btn" onclick="restart()" style="margin-top:8px">Play Again! 🎉</button>
</div>

<script>
'use strict';

// ── DATA ─────────────────────────────────────────────────────────────────────
const SCENES = ['garden','forest','castle'];
const LABELS = {garden:'🌸 Royal Garden', forest:'🌲 Magic Forest', castle:'🏰 Candy Castle'};

const OBJS = {
  garden:[
    {id:'sun',    x:83,y:11,sz:9,  e:'☀️', w:'SUN',  a:'a-spin',  f:'😄'},
    {id:'cloud',  x:32,y:17,sz:10, e:'☁️', w:'SKY',  a:'a-drift', f:'😊'},
    {id:'bird',   x:22,y:32,sz:7,  e:'🐦', w:'BIRD', a:'a-bob',   f:'😄'},
    {id:'tree1',  x:11,y:42,sz:15, e:'🌳', w:'TREE', a:'a-sway',  f:'😊'},
    {id:'tree2',  x:89,y:42,sz:15, e:'🌳', w:'TREE', a:'a-sway',  f:'😊'},
    {id:'butt',   x:65,y:38,sz:8,  e:'🦋', w:'FLY',  a:'a-float', f:'😍'},
    {id:'rose',   x:40,y:72,sz:9,  e:'🌹', w:'ROSE', a:'a-sway',  f:'😊'},
    {id:'tulip',  x:27,y:77,sz:7,  e:'🌷', w:'PINK', a:'a-sway',  f:'😊'},
    {id:'fount',  x:62,y:62,sz:13, e:'⛲', w:'RUBY', a:'a-bob',   f:'😻', gem:0},
  ],
  forest:[
    {id:'bigtree',x:78,y:37,sz:17, e:'🌲', w:'OAK',  a:'a-sway',  f:'😮'},
    {id:'owl',    x:72,y:27,sz:9,  e:'🦉', w:'OWL',  a:'a-bob',   f:'😮'},
    {id:'tree2',  x:18,y:35,sz:14, e:'🌲', w:'PINE', a:'a-sway',  f:'😊'},
    {id:'fox',    x:22,y:65,sz:10, e:'🦊', w:'FOX',  a:'a-bob',   f:'😄'},
    {id:'mush',   x:42,y:70,sz:9,  e:'🍄', w:'RED',  a:'a-bob',   f:'😮'},
    {id:'frog',   x:64,y:74,sz:8,  e:'🐸', w:'FROG', a:'a-float', f:'😄'},
    {id:'fire',   x:50,y:35,sz:8,  e:'🌟', w:'STAR', a:'a-float', f:'😍'},
    {id:'deer',   x:36,y:58,sz:10, e:'🦌', w:'DEER', a:'a-bob',   f:'😊'},
    {id:'rock',   x:55,y:62,sz:12, e:'🪨', w:'BLUE', a:'a-bob',   f:'😻', gem:1},
  ],
  castle:[
    {id:'rainbow',x:50,y:20,sz:13, e:'🌈', w:'BOW',  a:'a-float', f:'😍'},
    {id:'guard',  x:28,y:63,sz:11, e:'🐱', w:'CAT',  a:'a-bob',   f:'😄'},
    {id:'swan',   x:80,y:68,sz:10, e:'🦢', w:'SWAN', a:'a-drift', f:'😊'},
    {id:'cake',   x:16,y:67,sz:10, e:'🎂', w:'CAKE', a:'a-bob',   f:'😄'},
    {id:'wand',   x:80,y:40,sz:9,  e:'🪄', w:'WAND', a:'a-float', f:'😊'},
    {id:'rose2',  x:18,y:42,sz:10, e:'🌹', w:'ROSE', a:'a-sway',  f:'😊'},
    {id:'candy',  x:82,y:73,sz:9,  e:'🍭', w:'CANE', a:'a-bob',   f:'😄'},
    {id:'door',   x:50,y:48,sz:13, e:'🚪', w:'DOOR', a:'a-bob',   f:'😮'},
    {id:'throne', x:50,y:70,sz:14, e:'🪑', w:'CROWN',a:'a-bob',   f:'😻', gem:2},
  ],
};

const GEM_EMOJI = ['❤️','💙','💚'];
const GEM_NAME  = ['Ruby','Sapphire','Emerald'];
const CONF_CLR  = ['#ff9de2','#c484f3','#ffe44d','#ff6b9d','#a8c8ff','#fff','#ffd700'];
const SPARK_E   = ['✨','⭐','💫','🌟','💖'];

// ── STATE ─────────────────────────────────────────────────────────────────────
let scene    = 0;
let gems     = [false, false, false];
let soundOn  = true;
let cardOpen = false;
let cardObj  = null;
let cardEl   = null;
let cardLit  = new Set();
let actx     = null;
let mTimer   = null;

// ── AUDIO ─────────────────────────────────────────────────────────────────────
function ctx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function tone(f, d, type='triangle', vol=.16, delay=0) {
  if (!soundOn) return;
  try {
    const c=ctx(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type=type; o.frequency.value=f;
    const t=c.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t); o.stop(t+d+.05);
  } catch(e) {}
}
function sndClick()  { tone(880,.08,'sine',.18); tone(1100,.08,'sine',.14,.07); }
function sndLetter() { tone(660,.12,'sine',.2); }
function sndAllLit() { [523,659,784,1047,1319].forEach((f,i) => tone(f,.35,'sine',.22,i*.09)); }
function sndGemGet() { [523,659,784,1047,1319,1568].forEach((f,i) => tone(f,.4,'triangle',.28,i*.1)); }
function sndWin()    { [[523,0],[659,.15],[784,.3],[1047,.45],[784,.65],[1047,.8],[1319,.95],[1047,1.2],[1319,1.45],[1568,1.7]].forEach(([f,t])=>tone(f,.5,'triangle',.28,t)); }
function sndNav()    { [392,523].forEach((f,i) => tone(f,.12,'square',.1,i*.07)); }

const MELODIES = {
  garden: [[392,.25],[440,.2],[494,.2],[523,.35],[494,.2],[440,.2],[392,.4],[349,.2],[392,.2],[440,.2],[392,.55]],
  forest: [[294,.3],[330,.25],[370,.3],[330,.2],[294,.4],[262,.2],[294,.25],[330,.2],[370,.5]],
  castle: [[523,.2],[587,.2],[659,.2],[698,.3],[659,.2],[587,.2],[523,.5],[587,.2],[659,.2],[784,.55]],
};
function playMusic() {
  clearTimeout(mTimer);
  if (!soundOn) return;
  const notes = MELODIES[SCENES[scene]];
  let d = 0;
  notes.forEach(([f, dur]) => { tone(f, dur*.8, 'triangle', .07, d); d += dur; });
  mTimer = setTimeout(playMusic, (d + .6) * 1000);
}

// ── SPEECH ────────────────────────────────────────────────────────────────────
function say(txt) {
  if (!soundOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt.replace(/[✨💎❤️💙💚🌟⭐👑⭐]/g, ''));
  u.rate = .82; u.pitch = 1.25; u.volume = 1;
  const vs = speechSynthesis.getVoices();
  const v  = vs.find(v => /Samantha|Karen|Moira|Fiona/.test(v.name))
          || vs.find(v => v.lang.startsWith('en') && v.localService) || null;
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function toggleSnd() {
  soundOn = !soundOn;
  document.getElementById('snd').textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) { speechSynthesis?.cancel(); clearTimeout(mTimer); }
  else { ctx().resume(); playMusic(); }
}

// ── SCENE RENDER ──────────────────────────────────────────────────────────────
function renderScene(name) {
  const el = document.getElementById('sc-' + name);
  el.querySelectorAll('.obj').forEach(e => e.remove());
  OBJS[name].forEach(o => {
    if (o.gem !== undefined && gems[o.gem]) return;
    const div = document.createElement('div');
    div.className = 'obj ' + (o.a||'') + (o.gem !== undefined ? ' gem-obj' : '');
    div.style.cssText = `left:${o.x}%;top:${o.y}%;font-size:${o.sz}vmin`;
    if (o.gem !== undefined) {
      const hint = document.createElement('span');
      hint.className = 'gem-hint'; hint.textContent = '✨';
      div.appendChild(hint);
    }
    const ic = document.createElement('span');
    ic.className = 'ic'; ic.textContent = o.e;
    div.appendChild(ic);
    div.onclick = () => objClick(o, div);
    el.appendChild(div);
  });
}

// ── OBJECT CLICK → shows word card ────────────────────────────────────────────
function objClick(obj, el) {
  if (cardOpen) return;
  sndClick();
  el.classList.remove('boing'); void el.offsetWidth; el.classList.add('boing');
  el.addEventListener('animationend', () => el.classList.remove('boing'), {once:true});
  const r = el.getBoundingClientRect();
  sparks(r.left + r.width/2, r.top + r.height/2, 6);
  showCard(obj, el);
}

// ── WORD CARD ─────────────────────────────────────────────────────────────────
function showCard(obj, el) {
  cardOpen = true; cardObj = obj; cardEl = el; cardLit = new Set();

  document.getElementById('wc-emoji').textContent  = obj.e;
  document.getElementById('wc-prompt').textContent = `It's a ${obj.w.toLowerCase()}! Tap each letter!`;
  document.getElementById('wc-skip').style.opacity = '0';

  const row = document.getElementById('wc-row');
  row.innerHTML = '';
  [...obj.w].forEach((letter, i) => {
    const btn = document.createElement('button');
    btn.className = 'wc-btn';
    btn.textContent = letter;
    btn.onclick = () => tapLetter(i, letter, btn);
    row.appendChild(btn);
  });

  document.getElementById('wcard').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('kf').textContent = obj.f || '😊';

  say(`${obj.w.toLowerCase()}! Tap each letter!`);
}

function tapLetter(i, letter, btn) {
  if (cardLit.has(i)) {
    sndLetter();
    btn.style.animation = 'none'; void btn.offsetWidth; btn.style.animation = 'll .32s ease-out';
    say(letter);
    return;
  }

  cardLit.add(i);
  btn.classList.add('lit');
  sndLetter();
  say(letter);
  const r = btn.getBoundingClientRect();
  sparks(r.left + r.width/2, r.top + r.height/2, 5);

  if (cardObj.gem === undefined && cardLit.size === 1) {
    document.getElementById('wc-skip').style.opacity = '0.55';
  }

  if (cardLit.size === cardObj.w.length) {
    document.getElementById('wc-prompt').textContent = `⭐ ${cardObj.w}! Amazing! ⭐`;
    document.getElementById('kf').textContent = '😻';
    sparks(window.innerWidth/2, window.innerHeight * .72, 14);
    confetti(26);
    sndAllLit();
    say(`${cardObj.w.toLowerCase()}! You did it! Amazing!`);

    if (cardObj.gem !== undefined && !gems[cardObj.gem]) {
      setTimeout(() => { hideCard(); collectGem(cardObj, cardEl); }, 1500);
    } else {
      setTimeout(hideCard, 2000);
    }
  }
}

function hideCard() {
  document.getElementById('wcard').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('kf').textContent = '🐱';
  setTimeout(() => { cardOpen = false; }, 420);
}

// ── GEM COLLECTION ────────────────────────────────────────────────────────────
function collectGem(obj, el) {
  gems[obj.gem] = true;
  sndGemGet();
  if (el && el.parentNode) {
    el.classList.add('flyup');
    setTimeout(() => el.remove(), 600);
  }
  setTimeout(() => {
    const slot = document.getElementById('g' + obj.gem);
    slot.textContent = GEM_EMOJI[obj.gem];
    slot.classList.add('got');
    confetti(38);
    const sr = slot.getBoundingClientRect();
    sparks(sr.left + 20, sr.top + 20, 12);
    say(`You spelled ${GEM_NAME[obj.gem]}! The ${GEM_NAME[obj.gem]} gem is yours! ${gems.filter(Boolean).length} of 3 gems found!`);
    if (gems.every(Boolean)) setTimeout(winGame, 2000);
  }, 400);
}

// ── KITTY TAP ─────────────────────────────────────────────────────────────────
function kittyTap() {
  if (cardOpen) return;
  const lines = [
    "Meow! Tap every single thing you see! Each one has a word to learn!",
    `I have ${gems.filter(Boolean).length} gem${gems.filter(Boolean).length!==1?'s':''} so far! Help me find all three!`,
    "You are such a great reader! Purrrr!",
    "Tap something to learn its word! Then tap all the letters!",
    "Every word you learn makes my crown glow brighter! Meow!",
  ];
  sndClick();
  say(lines[Math.floor(Math.random() * lines.length)]);
  document.getElementById('kf').textContent = '😻';
  const r = document.getElementById('kitty').getBoundingClientRect();
  sparks(r.left + r.width/2, r.top + r.height/2, 7);
  setTimeout(() => document.getElementById('kf').textContent = '🐱', 2500);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function go(dir) {
  if (cardOpen) return;
  const next = scene + dir;
  if (next < 0 || next >= SCENES.length) return;
  sndNav();
  const tr = document.getElementById('trans');
  tr.classList.add('dark');
  setTimeout(() => {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    scene = next;
    const name = SCENES[scene];
    document.getElementById('sc-' + name).classList.add('active');
    document.getElementById('slabel').textContent = LABELS[name];
    document.getElementById('nl').classList.toggle('off', scene === 0);
    document.getElementById('nr').classList.toggle('off', scene === SCENES.length - 1);
    renderScene(name);
    playMusic();
    tr.classList.remove('dark');
    const intros = {
      garden: "Tap everything! Each object has a word to learn!",
      forest: "The magic forest! Tap things to learn their words!",
      castle: "The Candy Castle! Can you spell CROWN to get the last gem?",
    };
    setTimeout(() => { if (!cardOpen) say(intros[name]); }, 450);
  }, 380);
}

// ── WIN ───────────────────────────────────────────────────────────────────────
function winGame() {
  sndWin(); confetti(130);
  document.getElementById('win').classList.add('show');
  setTimeout(() => say("You spelled RUBY, BLUE, and CROWN! You found all three crown jewels! Princess Kitty's crown is restored! You are an amazing reader! Hooray!"), 700);
}

function restart() {
  gems = [false, false, false]; scene = 0; cardOpen = false;
  ['g0','g1','g2'].forEach(id => {
    const e = document.getElementById(id);
    e.classList.remove('got'); e.textContent = '💎';
  });
  document.getElementById('win').classList.remove('show');
  document.getElementById('kf').textContent = '🐱';
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById('sc-garden').classList.add('active');
  document.getElementById('slabel').textContent = LABELS.garden;
  document.getElementById('nl').classList.add('off');
  document.getElementById('nr').classList.remove('off');
  renderScene('garden');
  playMusic();
  setTimeout(() => say("Let's find the gems again! Tap everything to learn their words!"), 500);
}

// ── VFX ───────────────────────────────────────────────────────────────────────
function sparks(cx, cy, n) {
  const v = document.getElementById('vfx');
  for (let i = 0; i < n; i++) {
    const e = document.createElement('div');
    e.className = 'spark';
    e.textContent = SPARK_E[Math.floor(Math.random() * SPARK_E.length)];
    const a = (Math.PI * 2 * i / n) + (Math.random() - .5);
    const d = 55 + Math.random() * 70;
    e.style.cssText = `left:${cx}px;top:${cy}px;font-size:clamp(1em,3vw,1.5em);--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--d:${.6+Math.random()*.5}s;animation-delay:${Math.random()*.15}s`;
    v.appendChild(e); setTimeout(() => e.remove(), 1600);
  }
}
function confetti(n) {
  const v = document.getElementById('vfx');
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const e = document.createElement('div');
      e.className = 'conf';
      const sz = 8 + Math.random() * 10;
      e.style.cssText = `left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;background:${CONF_CLR[Math.floor(Math.random()*CONF_CLR.length)]};--d:${1.9+Math.random()*2.2}s;animation-delay:${Math.random()*.3}s`;
      v.appendChild(e); setTimeout(() => e.remove(), 5000);
    }, i * 18);
  }
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
if (window.speechSynthesis && speechSynthesis.getVoices().length === 0) {
  speechSynthesis.addEventListener('voiceschanged', () => {}, {once: true});
}

function startGame() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('sc-garden').classList.add('active');
  renderScene('garden');
  ctx().resume();
  playMusic();
  setTimeout(() => say("Hello! I'm Princess Kitty! My crown gems are lost! Tap everything you see to learn its word! Find all three gems! Let's go!"), 600);
}
</script>
